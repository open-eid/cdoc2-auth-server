server.port=9080

spring.jpa.hibernate.ddl-auto=none
app.restclient.session-nonce.readtimeout=1000
app.restclient.session-nonce.retries=2
app.session-nonce.uris=https://localhost:9080/session_nonce_1,https://localhost:9080/session_nonce_2

app.smartid.client.hostUrl=https://sid.demo.sk.ee/smart-id-rp/v3/
app.smartid.client.statusPollTimeoutSeconds=1
app.mobileid.client.hostUrl=https://tsp.demo.sk.ee/mid-api
app.mobileid.client.statusPollTimeoutSeconds=1

app.session-token.issuer=https://cdoc2-auth-server.ee

# Display text shown to users in MID/SID prompts, per language.
# Supports the {semanticsIdentifier} placeholder which is replaced with the user's identifier at runtime.
# Default (when unset): "Please confirm authentication: {semanticsIdentifier}"
app.auth.display-text.et=Kinnitage autentimine: {semanticsIdentifier}
app.auth.display-text.en=Please confirm authentication: {semanticsIdentifier}
app.auth.display-text.ru=\u041f\u043e\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u0435 \u0430\u0443\u0442\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044e: {semanticsIdentifier}
app.auth.display-text.defaultLanguage=et

# rate in milliseconds to run the auth process cleanup job. default is 30000
#app.cleanup.rate=30000
app.cleanup.authProcessMaxAgeMinutes=5

spring.ssl.bundle.jks.sid-server.truststore.location=classpath:demo_server_trusted_ssl_certs.jks
spring.ssl.bundle.jks.sid-server.truststore.password=changeit
spring.ssl.bundle.jks.sid-server.truststore.type=jks

spring.ssl.bundle.jks.trusted-infra.truststore.location=classpath:cdoc2_infra_truststore.jks
spring.ssl.bundle.jks.trusted-infra.truststore.password=changeit
spring.ssl.bundle.jks.trusted-infra.truststore.type=jks

spring.ssl.bundle.jks.mid-server.truststore.location=classpath:mobileid_demo_server_trusted_ssl_certs.p12
spring.ssl.bundle.jks.mid-server.truststore.password=passwd
spring.ssl.bundle.jks.mid-server.truststore.type=PKCS12

spring.ssl.bundle.jks.sid-trusted-issuers.truststore.location=classpath:test_sid_trusted_issuers.jks
spring.ssl.bundle.jks.sid-trusted-issuers.truststore.password=changeit
spring.ssl.bundle.jks.sid-trusted-issuers.truststore.type=jks

app.jwt.ecPrivateKeyPem=ec-es256-private.pem
app.well-known.publicKeys=ec-key-2025.pem,ec-key-2026.pem
app.well-known.activePublicKey=ec-key-2026.pem

app.rp.sid.name=DEMO
app.rp.sid.uuid=00000000-0000-4000-8000-000000000000
app.rp.mid.name=DEMO
app.rp.mid.uuid=00000000-0000-0000-0000-000000000000
app.rp.certificate-level=QUALIFIED
app.rp.scheme-name=smart-id-demo

